name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --default-index https://pypi.org/simple/ --all-groups

      - name: Check formatting
        run: uv run --locked --default-index https://pypi.org/simple/ ruff format --check .

      - name: Lint
        run: uv run --locked --default-index https://pypi.org/simple/ ruff check .

      - name: Type check
        run: uv run --locked --default-index https://pypi.org/simple/ mypy src/

      - name: Test
        run: uv run --locked --default-index https://pypi.org/simple/ pytest
